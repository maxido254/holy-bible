name: Build Android app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          mkdir -p www
          cp -r index.html app.js scenes.js download.js style.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png data www/
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OneBible-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HolyBible.apk
          gh release create "v1.0.${{ github.run_number }}" HolyBible.apk --title "Holy Bible v1.0.${{ github.run_number }}" --notes "Full Bible (KJV, ASV, YLT, BBE, NHEB, Swahili), read-aloud, kids section. Download HolyBible.apk on your Android phone and install it (allow installs from this source if asked)."
