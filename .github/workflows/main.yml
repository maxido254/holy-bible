name: Make kids scenes
on:
  workflow_dispatch:
  push:
    paths: ["data/kids/animation-queue.json"]
permissions:
  contents: write
  pull-requests: write
  models: read
jobs:
  scenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/make_scenes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: new-kids-scenes
          title: New kids scenes to review
          commit-message: Add kids scenes
